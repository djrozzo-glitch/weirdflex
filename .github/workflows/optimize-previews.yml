name: Optimize portfolio previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_previews.py'
      - '.github/workflows/optimize-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create smaller previews and update references
        run: python scripts/optimize_previews.py
      - name: Commit optimized preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Optimize four portfolio preview images as WebP"
            git push
          fi
