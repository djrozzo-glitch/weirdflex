name: Build WeirdFlex social preview
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_social_card.py'
      - '.github/workflows/build-social-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/build_social_card.py
      - name: Commit social image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/weirdflex-social.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generate WeirdFlex social sharing image"
            git push
          fi
