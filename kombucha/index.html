<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#091927">
<title>Kombucha Christmas Run</title>
<meta name="description" content="An endless Christmas run. Jump over obstacles and collect kombucha bottles in three snowy landscapes.">
<link rel="icon" href="ui/favicon.ico">
<link rel="apple-touch-icon" href="ui/app-icon-192.png">
<link rel="manifest" href="christmas/app.webmanifest">
<link rel="stylesheet" href="christmas/style.css">
</head>
<body>
<main>
  <canvas id="trail" aria-label="Snowy caribou running trail"></canvas>
  <div id="hud" hidden>
    <output id="score" aria-label="Score"><img src="assets/kombucha-bottle.webp" alt=""><span>0</span></output>
    <button id="pause" class="icon" aria-label="Pause"><img src="ui/pause.png" alt=""></button>
  </div>
  <button id="sound" class="icon" aria-label="Sound" aria-pressed="true"><img src="ui/sound-on.png" alt=""></button>
  <section id="screen" data-view="start" aria-label="Kombucha Christmas Run">
    <div class="panel" id="start">
      <img class="garland" src="ui/garland.png" alt="">
      <h1 class="wordmark"><img src="assets/kombucha-logo.png" alt="Kombucha Christmas Run"></h1>
      <p>Collect bottles. Jump over obstacles. Beat the high score.</p>
      <button id="play" class="primary action"><img src="ui/play.png" alt="">Start run</button>
      <button class="secondary board">Leaderboard</button>
      <small>Tap, Space or ↑ to jump. Twice to double jump.</small>
      <p id="start-status" class="status" role="status"></p>
    </div>
    <div class="panel" id="paused" hidden>
      <img class="trophy" src="ui/bell.png" alt="">
      <h2>Paused</h2>
      <button id="resume" class="primary">Resume</button>
      <button id="quit" class="secondary">Main menu</button>
    </div>
    <div class="panel" id="result" hidden>
      <img class="result-caribou" src="assets/kombucha_game_over.png" alt="">
      <h2>Run complete</h2>
      <p class="big-score"><span id="final">0</span> pts</p>
      <p id="details"></p>
      <form id="submit-score" hidden>
        <label for="nickname">Leaderboard name</label>
        <div class="entry"><input id="nickname" name="nickname" type="text" maxlength="24" autocomplete="nickname" required><button class="primary">Submit</button></div>
      </form>
      <p id="save-status" class="status" role="status"></p>
      <button id="retry" class="primary action"><img src="ui/replay.png" alt="">Run again</button>
      <button class="secondary board">Leaderboard</button>
      <p id="retry-status" class="status" role="status"></p>
    </div>
    <div class="panel" id="leaderboard" hidden>
      <img class="trophy" src="ui/trophy.png" alt="">
      <h2>Leaderboard</h2>
      <p id="board-status" class="status" role="status"></p>
      <ol id="leaders"></ol>
      <button id="back" class="secondary">Back</button>
    </div>
  </section>
</main>
<script type="module" src="christmas/game.mjs?v=20261115b"></script>
</body>
</html>
